version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: craftloop-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=craftloop_production_jwt_secret_change_in_prod
      - MONGODB_URI=mongodb+srv://craftloop_user:your_password@cluster0.te6injr.mongodb.net/craftloop?retryWrites=true&w=majority
      - CLOUDINARY_CLOUD_NAME=
      - CLOUDINARY_API_KEY=
      - CLOUDINARY_API_SECRET=
    depends_on:
      - mongo-local
    networks:
      - craftloop-net

  mongo-local:
    image: mongo:7.0
    container_name: craftloop-mongo-local
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - craftloop-net

volumes:
  mongo_data:

networks:
  craftloop-net:
    driver: bridge
