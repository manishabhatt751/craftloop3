name: CraftLoop CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Frontend
        run: |
          cd client
          npm run build

      - name: Run Backend Integration Test Suite
        env:
          PORT: 5000
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_craftloop_2026
          MONGODB_URI: mongodb://localhost:27017/craftloop
        run: |
          cd server
          node server.js &
          sleep 4
          node test_full_production_suite.js
